name: Deployment readiness

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system GIS libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev libspatialite-dev
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-test-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          CSRF_TRUSTED_ORIGINS: http://localhost:5173
          AI_EXPLANATIONS_ENABLED: 'False'
          RAG_ENABLED: 'False'
        run: |
          python manage.py check
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sti-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sti-frontend/package-lock.json
      - run: npm ci
      - run: npm run build